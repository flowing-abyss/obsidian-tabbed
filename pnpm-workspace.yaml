packages:
  - .

minimumReleaseAge: 1440
blockExoticSubdeps: true
saveExact: true
overrides:
  # Security patch for a transitive dep of mocha/wdio; drop-in bump everywhere it's
  # pulled in.
  serialize-javascript: '>=7.0.7'
  # Glob 13 has no backport for this traversal-cancellation vulnerability. Mocha
  # and Appium use the compatible sync/async APIs retained by Glob 14.
  # https://github.com/advisories/GHSA-3g3m-2fjr-6pw4
  'glob@13': 14.0.5
  # Fix globparts amplification without changing legacy Minimatch 3/9 consumers.
  # https://github.com/advisories/GHSA-g3hv-75wg-m249
  'minimatch@10': 11.0.8

allowBuilds:
  # webdriverio's Firefox/Edge driver managers — Obsidian is Electron/Chromium-only,
  # neither is ever invoked, and both would just try to download a browser driver.
  '@parcel/watcher': false
  edgedriver: false
  geckodriver: false
  appium: true
  classic-level: true
  esbuild: true
  unrs-resolver: true
